<!doctype html>
<html lang="ru" class="ar-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061c24">
  <title>WebAR V8 HD | NFC VisitCard</title>
  <link rel="stylesheet" href="style.css?v=8">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    if (window.AFRAME && !window.AFRAME.systems.arjs) {
      document.write('<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"><' + '/script>');
    }
  </script>
  <script defer src="ar-ui.js?v=8"></script>
</head>
<body>
  <!-- Keep the known-good AR.js tracking camera. The profile itself is rendered as crisp DOM. -->
  <a-scene id="scene" embedded vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="alpha: true; antialias: true; precision: medium"
    arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false; sourceWidth: 960; sourceHeight: 720; canvasWidth: 960; canvasHeight: 720;">
    <a-marker id="hiro-marker" preset="hiro" emitevents="true"
      smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
      <a-ring position="0 0.012 0" rotation="-90 0 0" radius-inner="0.675"
        radius-outer="0.69" material="shader: flat; color: #77ffe5; transparent: true; opacity: 0.78; side: double"></a-ring>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Anchored 2.5D overlay: tracks HIRO in 3D, but stays front-facing and touchable. -->
  <div id="ar-overlay" class="ar-overlay" hidden aria-label="Виртуальная визитка">
    <article class="floating-card">
      <div class="card-topline"><span class="card-id">NFC / DIGITAL ID</span><span class="card-live"><span></span> WEBAR</span></div>
      <div class="card-person">
        <div class="card-monogram" aria-hidden="true">A</div>
        <div class="card-person-info"><div class="card-eyebrow">ПЕРСОНАЛЬНАЯ ВИЗИТКА</div>
          <h1>AKBAR</h1>
          <p>Head of IT <span aria-hidden="true">·</span> Digital Solutions</p>
        </div>
      </div>
      <div class="card-rule"></div>
      <p class="card-tagline">Контакты одним касанием. Виртуальная визитка прямо над картой.</p>
      <div class="card-controls">
        <button class="card-main-button save-action" type="button">✦ Сохранить контакт</button>
        <a class="card-secondary" href="index.html?v=8">Профиль <span aria-hidden="true">↗</span></a>
        <button class="card-secondary share-action" type="button">Поделиться <span aria-hidden="true">↗</span></button>
      </div>
      <div class="card-edge" aria-hidden="true"><span></span><span></span><span></span></div>
    </article>
  </div>

  <div id="hud" aria-live="polite">
    <header class="hud-top">
      <span class="hud-title">&#10022; LIVE WEBAR <small>V8 / HD</small></span>
      <nav class="hud-tools" aria-label="AR camera controls">
        <a id="quality-switch" class="quality-switch" href="ar.html?v=8" title="Switch to proven stable tracking">STD</a>
        <button type="button" id="rotate-card" class="rotate-view" aria-label="Rotate virtual card 90 degrees" aria-pressed="false" title="Rotate virtual card">&#8635; 90&#176;</button>
        <a class="exit" href="index.html?v=8">&#x0417;&#x0430;&#x043a;&#x0440;&#x044b;&#x0442;&#x044c; &times;</a>
      </nav>

    </header>
    <footer class="hud-bottom">
      <div id="status" class="status">Ожидаем подключение камеры…</div>
      <div id="actions" class="hud-actions">
        <button type="button" class="save-action">Сохранить контакт</button>
        <a href="index.html?v=8">Моя визитка</a>
        <button type="button" class="share-action">Поделиться</button>
      </div>
      <div class="understatus">
        <a href="camera-test.html?v=8">Тест камеры</a>
        <a href="print-large.html?v=8">HIRO XL</a>
        <button type="button" id="retry-ar">Перезапустить AR</button>
      </div>
      <details id="diagnostics">
        <summary>Техническая диагностика</summary>
        <pre id="diag-output">Запуск…</pre>
      </details>
    </footer>
  </div>
</body>
</html>
