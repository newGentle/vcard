<!doctype html>
<html lang="ru" class="ar-page"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#061a20"><title>VisitCard — LIVE WebAR V3</title>
<link rel="stylesheet" href="style.css?v=3">
<script defer src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script defer src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
<script defer src="ar-ui.js?v=3"></script>
</head><body>
<!-- Static scene is initialized once by A-Frame; no late script injection or scene creation. -->
<a-scene id="scene" embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
 renderer="alpha: true; antialias: true; precision: medium"
 arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false;">
  <a-marker id="hiro-marker" preset="hiro" emitevents="true"
    smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
    <a-box position="0 0.45 0" width="1.38" height="0.85" depth="0.08"
      color="#123e49" material="transparent: true; opacity: 0.95"></a-box>
    <a-plane position="0 0.45 0.046" width="1.30" height="0.78" color="#17414d"></a-plane>
    <a-text value="AKBAR" align="center" width="2.7" color="#9af6d8"
      position="0 0.62 0.055"></a-text>
    <a-text value="HEAD OF IT" align="center" width="1.85" color="#ffffff"
      position="0 0.39 0.055"></a-text>
    <a-text value="INTERACTIVE VISITCARD" align="center" width="1.2" color="#c2ded7"
      position="0 0.20 0.055"></a-text>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
<div id="hud" aria-live="polite">
  <header class="hud-top"><span class="hud-title">✦ LIVE WEBAR · V3</span><a class="exit" href="index.html">Закрыть ×</a></header>
  <footer class="hud-bottom">
    <div class="status" id="status">Инициализация камеры и AR…</div>
    <div id="actions" class="hud-actions">
      <a href="index.html">Моя визитка</a><a href="print.html" target="_blank" rel="noopener">AR-маркер</a>
    </div>
    <div class="understatus"><a href="camera-test.html">Проверить камеру</a><a href="print.html">Показать маркер</a></div>
    <details id="diagnostics"><summary>Техническая диагностика</summary><pre id="diag-output"></pre></details>
  </footer>
</div>
</body></html>
