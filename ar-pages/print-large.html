<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIRO XL 90mm | WebAR V8</title>
<style>body{margin:0;background:#edf3f1;color:#0b3638;font:15px/1.5 system-ui,Arial;text-align:center}
main{margin:24px auto;padding:15px;max-width:680px}h1{font-size:24px}.sheet{box-sizing:border-box;background:#fff;padding:14mm;width:fit-content;max-width:100%;margin:20px auto;box-shadow:0 8px 28px #07352727}.sheet img{display:block;width:90mm;height:90mm;max-width:100%;object-fit:contain}.btn{padding:12px 20px;border:0;border-radius:10px;background:#0d5f59;color:#fff;font-weight:800;font-size:14px}.help{font-size:13px;max-width:520px;margin:12px auto}a{color:#0d5f59}#notice{color:#a14b2d;font-weight:700}

</style></head><body><main><div class="no-print"><h1>HIRO XL &#183; 90 mm</h1><p class="help">A larger marker can improve recognition distance. Print at 100% scale on a flat sheet, with bright uniform light. This is a tracking test, not the final PVC card.</p></div>
<div class="sheet"><img id="marker" src="https://raw.githubusercontent.com/AR-js-org/AR.js/3.4.8/data/images/hiro.png" alt="AR.js Hiro fiducial"></div>
<div class="no-print"><p id="notice">Loading HIRO marker...</p><button class="btn" id="print" disabled>Print 100%</button><p class="help"><a href="ar-hd.html?v=8">HD tracking</a> / <a href="ar.html?v=8">Stable tracking</a> / <a href="print.html?v=8">PVC layout</a></p></div>
</main><script>const img=document.getElementById('marker'),btn=document.getElementById('print'),n=document.getElementById('notice');img.addEventListener('load',()=>{n.textContent='HIRO loaded - printable';n.style.color='#167154';btn.disabled=false});img.addEventListener('error',()=>{n.textContent='HIRO image unavailable - do not print';btn.disabled=true});if(img.complete&&img.naturalWidth){n.textContent='HIRO loaded - printable';n.style.color='#167154';btn.disabled=false}btn.addEventListener('click',()=>print());</script></body></html>
