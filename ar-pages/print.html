<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR VisitCard · HIRO-маркер V5</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eeed;text-align:center;color:#132c2d;font-family:system-ui,Arial}.layout{max-width:620px;margin:24px auto;padding:12px}.card{margin:24px auto;width:86mm;height:54mm;padding:4mm;display:flex;gap:4mm;align-items:center;justify-content:center;background:#10353e;color:#f1fff9;border-radius:2mm;box-shadow:0 15px 40px #1235}.card img{width:39mm;height:39mm;display:block;background:white}.card .name{font-size:15px;font-weight:850;line-height:1.45}.card .name small{font-size:10px}.help{font-size:13px;line-height:1.6;margin:14px 0}.btn{border:0;padding:14px 20px;background:#17494a;color:white;border-radius:10px;cursor:pointer}#notice{font-size:13px;color:#923e26;font-weight:650}@media print{@page{size:A4;margin:12mm}body{background:white}.no-print{display:none}.card{box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><div class="layout"><h1 class="no-print">HIRO — AR-маркер</h1><p class="help no-print">Для проверки можно показать маркер на втором экране. Для печати используйте масштаб 100%.</p><div class="card"><img id="marker" alt="HIRO marker" src="https://raw.githubusercontent.com/AR-js-org/AR.js/3.4.8/data/images/hiro.png"><div class="name">AR<br>VISITCARD<br><small>TEST / V5</small></div></div><p id="notice" class="no-print">Ожидаем загрузку маркера…</p><button class="btn no-print" id="print" disabled>Печать</button><p class="help no-print"><a href="ar.html?v=5">Открыть WebAR</a> · <a href="index.html?v=5">К визитке</a><br>Если HIRO не появился, не печатайте пустой прямоугольник.</p></div><script>
const img=document.getElementById('marker'),btn=document.getElementById('print'),note=document.getElementById('notice');img.onload=()=>{note.textContent='HIRO загружен — можно печатать';note.style.color='#176b4b';btn.disabled=false};img.onerror=()=>{note.textContent='Не удалось загрузить изображение HIRO — проверьте интернет';btn.disabled=true};if(img.complete && img.naturalWidth)img.onload();btn.onclick=()=>window.print();
</script></body></html>
