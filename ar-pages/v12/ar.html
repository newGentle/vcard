<!doctype html>
<html lang="ru" class="v12-ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#051726">
  <title>AA WebAR V12 — Transparent 3D</title>
  <link rel="stylesheet" href="v12.css?v=12">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    if (window.AFRAME && !window.AFRAME.systems.arjs) {
      document.write('<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"><'+'/script>');
    }
  </script>
  <script src="v12.js?v=12" defer></script>
</head>
<body>
  <a-scene id="scene" embedded vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="alpha: true; antialias: true; precision: medium"
    arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false; patternRatio: 0.7; sourceWidth: 640; sourceHeight: 480;">
    <a-assets timeout="16000">
      <img id="frame-texture" crossorigin="anonymous" src="assets/frame.png">
      <img id="text-texture" crossorigin="anonymous" src="assets/copy.png">
      <img id="logo-texture" crossorigin="anonymous" src="assets/aa-ribbon-transparent.png">
      <img id="photo-frame-texture" crossorigin="anonymous" src="assets/portrait-frame.png">
      <img id="particles-texture" crossorigin="anonymous" src="assets/particles.png">
      <img id="github-photo" crossorigin="anonymous" src="https://newgentle.github.io/photo.webp">
      <img id="photo-fallback-texture" crossorigin="anonymous" src="assets/portrait-fallback.png">
    </a-assets>

    <a-marker id="aa-marker" type="pattern" url="pattern-aa-v11.patt" emitevents="true"
      smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
      <!-- 1. The fiducial footprint is exactly 1 x 1 marker unit, at y=0.006. -->
      <a-plane id="corner-plane" class="true-ar-layer" position="0 0.006 0" rotation="-90 0 0"
        width="1" height="1" material="shader: flat; src: #frame-texture; transparent: true; alphaTest: 0.02; depthWrite: false; side: double"></a-plane>
      <!-- 2. Translucent particles remain attached to the physical marker frame. -->
      <a-plane class="true-ar-layer" position="0 0.035 0" rotation="-90 0 0"
        width="1" height="1" material="shader: flat; src: #particles-texture; transparent: true; alphaTest: 0.01; depthWrite: false; side: double"></a-plane>
      <!-- 3. The portrait has its own plane, producing real perspective/parallax. -->
      <a-plane id="portrait-photo" position="0.271 0.095 -0.128" rotation="-90 0 0"
        width="0.212" height="0.373" material="shader: flat; src: #github-photo; side: double; depthWrite: false"></a-plane>
      <a-plane id="portrait-fallback-plane" visible="false" position="0.271 0.095 -0.128" rotation="-90 0 0"
        width="0.212" height="0.373" material="shader: flat; src: #photo-fallback-texture; transparent: true; side: double; depthWrite: false"></a-plane>
      <a-plane id="portrait-frame" position="0 0.111 0" rotation="-90 0 0"
        width="1" height="1" material="shader: flat; src: #photo-frame-texture; transparent: true; alphaTest: 0.015; depthWrite: false; side: double"></a-plane>
      <!-- 4. Transparent high-contrast typography is a separate raised layer. -->
      <a-plane id="name-plane" position="0 0.132 0" rotation="-90 0 0"
        width="1" height="1" material="shader: flat; src: #text-texture; transparent: true; alphaTest: 0.02; depthWrite: false; side: double"></a-plane>
      <!-- 5. Original selected AA ribbon extracted from the dark background. -->
      <a-plane id="logo-plane" position="-0.226 0.158 -0.164" rotation="-90 0 0"
        width="0.405" height="0.279" material="shader: flat; src: #logo-texture; transparent: true; alphaTest: 0.04; depthWrite: false; side: double"
        animation="property: position; from: -0.226 0.158 -0.164; to: -0.226 0.177 -0.164; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"></a-plane>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <main id="hud" aria-label="AA WebAR V12">
    <header class="hud-top">
      <span class="product-title"><span class="live-dot"></span> AA <b>TRUE 3D</b> <small>V12</small></span>
      <div class="top-actions">
        <a class="minor-action" href="ar-hd.html?v=12" title="Экспериментальный HD">HD</a>
        <a class="exit-action" href="index.html">Закрыть ×</a>
      </div>
    </header>
    <footer class="hud-bottom">
      <div id="status" class="status" role="status" aria-live="polite">Разрешите доступ к задней камере, затем наведите её на маркер AA.</div>
      <div class="contact-actions" aria-label="Контакты">
        <button id="save-contact" type="button" class="strong">Сохранить</button>
        <a href="../cv.html" class="action">Полное CV</a>
        <a href="https://t.me/Newgentle" target="_blank" rel="noopener" class="action">Telegram</a>
        <button id="share-profile" type="button" class="action">Поделиться</button>
      </div>
      <nav class="mini-links" aria-label="Тестирование и помощь">
        <a href="print.html">AA-маркер</a>
        <a href="preview.html">Просмотр 3D</a>
        <a href="../ar-hiro.html?v=8">HIRO (резерв)</a>
        <button id="restart-ar" type="button">Повторить</button>
      </nav>
      <details id="diagnostics">
        <summary>Диагностика AR <span id="status-light" aria-hidden="true"></span></summary>
        <pre id="diag-output">Инициализация…</pre>
      </details>
    </footer>
  </main>
</body>
</html>
